name: Build and smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Enable public cache (read-only)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cf-cli
          skipPush: true
      - name: Test automation merge guards
        run: python3 -m unittest discover -s tests -v
      - name: Evaluate flake outputs
        run: nix flake check --all-systems --no-build
      - name: Build package
        run: nix build .#cf-cli --print-build-logs
      - name: Smoke-test installed CLI without credentials
        run: python3 scripts/smoke-test.py result
      - name: Test flake app entry points
        run: |
          nix run . -- --version
          nix run .#cloudflare -- --version
      - name: Publish smoke-tested output to Cachix
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          OUTPUT=$(python3 -c 'import os; print(os.path.realpath("result"))')
          cachix push cf-cli "$OUTPUT"
          HASH=$(basename "$OUTPUT" | cut -d- -f1)
          curl --fail --retry 5 --retry-delay 2 "https://cf-cli.cachix.org/$HASH.narinfo"

  tag:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish fixed tag for the exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/tag-version.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --keep-existing
