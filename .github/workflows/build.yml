name: Build and smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Test automation merge guards
        run: python3 -m unittest discover -s tests -v
      - name: Evaluate flake outputs
        run: nix flake check --all-systems --no-build
      - name: Build package
        run: nix build .#cf-cli --print-build-logs
      - name: Smoke-test installed CLI without credentials
        run: python3 scripts/smoke-test.py result
      - name: Test flake app entry points
        run: |
          nix run . -- --version
          nix run .#cloudflare -- --version
