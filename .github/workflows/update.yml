name: Update cf

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Optional version for a draft test PR (never merged)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cf-updater
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'schedule' || vars.AUTO_UPDATE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      sha: ${{ steps.update.outputs.sha }}
      base: ${{ steps.update.outputs.base }}
      pr: ${{ steps.update.outputs.pr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Verify server-side merge protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os, runpy; runpy.run_path("scripts/merge-update.py")["require_server_merge_guard"](os.environ["GITHUB_REPOSITORY"])'
      - name: Use pinned Node and npm
        run: |
          NODE=$(nix build --impure --no-link --print-out-paths --expr 'let f = builtins.getFlake (toString ./.); p = import f.inputs.nixpkgs { system = builtins.currentSystem; }; in p.nodejs_22')
          printf '%s/bin\n' "$NODE" >> "$GITHUB_PATH"
      - name: Generate signed update PR
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          if [ -n "$TEST_VERSION" ]; then
            python3 scripts/prepare-update.py --test-version "$TEST_VERSION"
          else
            python3 scripts/prepare-update.py
          fi

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    name: Validate update (${{ matrix.system }})
    permissions:
      contents: read
      checks: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --all-systems --no-build
      - run: nix build .#cf-cli --print-build-logs
      - run: python3 scripts/smoke-test.py result
      - run: nix run . -- --version
      - name: Publish required check on exact candidate SHA
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CHECK_NAME: ${{ matrix.system }}
          CONCLUSION: ${{ job.status }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="$CHECK_NAME" -f head_sha="$CANDIDATE_SHA" \
            -f status=completed -f conclusion="$CONCLUSION" \
            -f details_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  merge:
    needs: [prepare, validate]
    if: >-
      vars.AUTO_UPDATE_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'push' &&
      inputs.test_version == '' &&
      needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Merge only the exact validated bot update
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PR: ${{ needs.prepare.outputs.pr }}
          UPDATE_SHA: ${{ needs.prepare.outputs.sha }}
          UPDATE_BASE: ${{ needs.prepare.outputs.base }}
        run: python3 scripts/merge-update.py
      # GITHUB_TOKEN merges do not trigger ordinary push workflows.
      - name: Build and tag merged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
